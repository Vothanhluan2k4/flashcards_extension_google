<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards - Xuất PDF</title>
  <style>
    :root {
      --ink: #1e1e24;
      --bg: #faf8f5;
      --yellow: #ffe599;
      --pink: #ff94ae;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 32px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      background: var(--bg);
      border: 2px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      border: 2px solid var(--ink);
      padding: 8px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: #ffffff;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .btn-primary {
      background: var(--pink);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 900;
    }
    .meta {
      margin: 0 0 22px;
      font-size: 13px;
      color: #555;
    }
    .set-block {
      margin-bottom: 24px;
      break-inside: avoid-page;
    }
    .set-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 900;
      padding: 6px 10px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      display: inline-block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1.5px solid var(--ink);
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--bg);
      font-weight: 800;
    }
    .col-num { width: 46px; text-align: center; }
    .col-type { width: 110px; }
    @media print {
      body { padding: 0; }
      .toolbar { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Xem trước bản in / Lưu PDF</strong>
    <div class="toolbar-actions">
      <button id="btnPrint" class="btn btn-primary" type="button">In / Lưu PDF</button>
      <button id="btnClose" class="btn" type="button">Đóng</button>
    </div>
  </div>
  <h1>Danh sách Flashcards</h1>
  <p id="printMeta" class="meta"></p>
  <div id="printContent"></div>
  <script src="js/print.js"></script>
</body>
</html>
